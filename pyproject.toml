[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiinyapp-farm"
version = "0.1.8"
description = "Install and run community apps beside your Tiiny AI Pocket Lab"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://tiinyapp.farm"
Repository = "https://github.com/Titanium-Devops/tiinyapp-farm"

[project.scripts]
farm = "farm.farm:main"

[tool.setuptools]
packages = ["farm"]
