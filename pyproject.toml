[project]
name = "tinyapp-farm"
version = "0.1.0"
description = "Install and run community apps beside your Tiiny AI Pocket Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
farm = "farm.farm:main"

[tool.setuptools]
packages = ["farm"]
