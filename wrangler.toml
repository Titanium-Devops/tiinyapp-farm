name = "tiinyapp-farm"
account_id = "5a845e69fbed4f4e64e2176d86637680"
compatibility_date = "2026-09-12"
workers_dev = false
main = "worker/main.mjs"

[[routes]]
pattern = "tiinyapp.farm"
custom_domain = true

[assets]
binding = "ASSETS"
run_worker_first = ["/api/*", "/seeds-files/*", "/account", "/account/*", "/plant", "/plant/*", "/seeds", "/seeds/*", "/farm", "/farm/*", "/seeds/mine", "/seeds/mine/*", "/makers/*", "/media/*"]
directory = "./site/dist"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "FARM"
id = "9721f38131824562bdc2f0af690645f7"

[[r2_buckets]]
binding = "SEEDS"
bucket_name = "farm-seeds"

[[durable_objects.bindings]]
name = "FARM_COORDINATOR"
class_name = "FarmCoordinator"

[[migrations]]
tag = "v1-farm-coordinator"
new_sqlite_classes = ["FarmCoordinator"]

[vars]
FARM_ADMINS = "dd3d7322-eae6-474d-af08-827613b20ecd"
