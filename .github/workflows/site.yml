name: Build and deploy the farm

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A manifest-only pull request changes no installer code, and the six-job
  # OS matrix is the reason a release takes about fifteen minutes instead of
  # about six: the macOS and Windows runners spend most of that queueing.
  # Those pull requests get one Linux job instead of six. Not zero, because a
  # manifest can still break the installer by introducing something it has
  # never seen, such as a capability token no app had used before. Pushes to
  # main always run the full matrix.
  scope:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          FULL='{"os":["blacksmith-2vcpu-ubuntu-2404","blacksmith-6vcpu-macos-latest","blacksmith-4vcpu-windows-2025"],"python":["3.9","3.12"]}'
          ONE='{"os":["blacksmith-2vcpu-ubuntu-2404"],"python":["3.12"]}'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          # Anything outside a manifest or its art means the full matrix.
          OTHER=$(echo "$CHANGED" | grep -vE '^(manifests/[^/]+\.json|site/assets/art/[^/]+)$' || true)
          if [ -n "$OTHER" ]; then
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
            echo "reason=touches more than manifests and art" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$ONE" >> "$GITHUB_OUTPUT"
            echo "reason=manifest and art only" >> "$GITHUB_OUTPUT"
          fi
  tests:
    needs: scope
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Why this matrix
        shell: bash
        run: echo "${{ needs.scope.outputs.reason }}"
      - name: Test the installer with a fake device
        run: python -m unittest tests.test_farm
  site:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Worker routes with offline service fakes
        run: node --test tests/worker.test.mjs
      - name: Install image renderer
        run: python3 -m pip install pillow
      - name: Build the static site
        run: python3 scripts/build-site.py
      - name: Test the installer and the site
        run: python3 -m unittest
      - name: Deploy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          # Wrangler 3 ignores assets.run_worker_first and would deploy the site
          # without worker-first routing for /api/*, /account/* and /makers/*.
          wranglerVersion: '4.131.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
