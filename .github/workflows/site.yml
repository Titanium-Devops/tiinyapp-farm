name: Build and deploy the farm

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Worker routes with offline service fakes
        run: node --test tests/worker.test.mjs
      - name: Install image renderer
        run: python3 -m pip install pillow
      - name: Build the static site
        run: python3 scripts/build-site.py
      - name: Test the installer and the site
        run: python3 -m unittest
      - name: Deploy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
