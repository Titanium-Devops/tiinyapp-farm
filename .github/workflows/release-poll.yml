name: Poll for new app releases

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [release-poll]
  workflow_dispatch:
    inputs:
      app:
        description: 'One app id to check (blank checks every listed app)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    # A pull request opened with the built-in GITHUB_TOKEN does not start the
    # manifest checks, so every write here goes through the farm's GitHub App.
    env:
      FARM_APP_ID: ${{ secrets.FARM_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report the missing App registration
        if: env.FARM_APP_ID == ''
        run: |
          echo "The farm GitHub App is not registered yet, so nothing was checked." >> "$GITHUB_STEP_SUMMARY"
          echo "Add FARM_APP_ID and FARM_APP_PRIVATE_KEY; docs/GITHUB-APP.md has the settings." >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: FARM_APP_ID and FARM_APP_PRIVATE_KEY are not set. See docs/GITHUB-APP.md."
      - name: Mint an installation token for the farm's GitHub App
        id: token
        if: env.FARM_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FARM_APP_ID }}
          private-key: ${{ secrets.FARM_APP_PRIVATE_KEY }}
      - name: Open a bump pull request for every newer release
        if: env.FARM_APP_ID != ''
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ONLY_APP: ${{ inputs.app }}
        run: |
          if [ -n "$ONLY_APP" ]; then
            python3 scripts/poll-releases.py --app "$ONLY_APP"
          else
            python3 scripts/poll-releases.py
          fi
      - name: Report poll heartbeat
        if: always()
        env:
          WATCHTOWER_BEAT_TOKEN: ${{ secrets.WATCHTOWER_BEAT_TOKEN_POLL }}
        run: |
          if [ -z "$WATCHTOWER_BEAT_TOKEN" ]; then
            echo "Heartbeat skipped because WATCHTOWER_BEAT_TOKEN_POLL is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "Heartbeat skipped: WATCHTOWER_BEAT_TOKEN_POLL is not set."
            exit 0
          fi
          body_file="$RUNNER_TEMP/release-poll-heartbeat.txt"
          if ! status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" \
            "https://watchtower.jbrashear.workers.dev/beat/$WATCHTOWER_BEAT_TOKEN")"; then
            echo "Heartbeat request failed."
            exit 1
          fi
          response="$(tr -d '\r\n' < "$body_file")"
          if [ "$status" = "404" ]; then
            echo "::warning::Heartbeat target is not enabled yet."
            echo "Heartbeat target is not enabled yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "200" ] || [ "$response" != "ok" ]; then
            echo "Heartbeat endpoint did not answer ok (HTTP $status)."
            exit 1
          fi
          echo "Heartbeat received."
