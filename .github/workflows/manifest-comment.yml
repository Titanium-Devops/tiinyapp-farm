name: Comment on manifest checks
on:
  workflow_run:
    workflows: ['Manifest submission checks']
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No checkout and no execution of PR code or artifact contents in this job.
      - name: Download the data-only report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: manifest-results
          path: results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const prs = run.pull_requests.length ? run.pull_requests :
              (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: run.head_sha
              })).data;
            const marker = '<!-- farm-manifest-checks -->';
            const cell = value => String(value).replace(/[&<>|@\r\n]/g,
              c => ({'&':'&amp;','<':'&lt;','>':'&gt;','|':'&#124;','@':'&#64;',
                     '\r':' ', '\n':' '})[c]).slice(0, 1200);
            let rows = [{check:'workflow', result:'FAIL', detail:'Report unavailable; inspect the checks run'}];
            try {
              const stat = fs.statSync('results/submission-report.json');
              if (stat.size > 2 * 1024 * 1024) throw new Error('Oversized report');
              const report = JSON.parse(fs.readFileSync('results/submission-report.json', 'utf8'));
              if (!Array.isArray(report.rows)) throw new Error('Invalid report');
              rows = report.rows.slice(0, 100);
            } catch (_) {}
            let body = marker + '\n| Check | Result | Detail |\n| --- | --- | --- |\n';
            body += `| Workflow | ${run.conclusion === 'success' ? 'PASS' : 'FAIL'} | See the checks run for complete results |\n`;
            for (const row of rows) {
              const line = `| ${cell(row.check)} | ${cell(row.result)} | ${cell(row.detail)} |\n`;
              if (body.length + line.length > 58000) { body += '| Report | INFO | Remaining rows are in the artifact |\n'; break; }
              body += line;
            }
            body += '\nCI never sets verified. A maintainer records verification in a follow-up commit.';
            for (const pr of prs) {
              const current = (await github.rest.pulls.get({...context.repo, pull_number:pr.number})).data;
              if (current.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) continue;
              if (current.head.sha !== run.head_sha || current.state !== 'open') continue;
              const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number:pr.number});
              const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
              if (existing) await github.rest.issues.updateComment({...context.repo, comment_id:existing.id, body});
              else await github.rest.issues.createComment({...context.repo, issue_number:pr.number, body});
            }
